<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact formations and shared cover</title></head><body><h2>Compact formation layout</h2><p>Production renderers · no saved game is read or written.</p><main class="company-map" id="cards"></main><script type="module">
import '../src/style.css';import '../src/ui/company.css';import '../src/ui/workspace.css';
import {formationGrid,bindUnitTooltips} from '../src/ui/formationGrid.js';import {terrainMarkers} from '../src/ui/terrainMarkers.js';import {terrainInformation,terrainFooter,hillStack} from '../src/ui/terrainPresentation.js';import {terrainBorders} from '../src/ui/terrainBorders.js';import {borders} from '../src/sim/company/terrain.js';
const units=Array.from({length:6},(_,i)=>({id:'a'+i,name:`Assault team ${i+1}`,kind:'LAT',steps:1,cohesion:'A',exposed:true,experience:'Line',cover:null,attempted:[],radios:[],tactical_ready:true}));
units.push({id:'staff',name:'First Sergeant',kind:'STAFF',steps:1,cohesion:'GOOD',exposed:true,experience:'Line',cover:'c',attempted:['MOVE'],radios:[],tactical_ready:true});
const cards=[1,2].map(n=>({id:'l'+n,name:`1.${n} Village / Hill`,elevation:2,hills:['hill'],known:true,protection:3,borders:borders(),cover_draw:4,cover_limit:3,building:true,trafficability:'Slow',covers:[{id:'c',type:'Cover',value:1,known:true,discovered:true}]}));
document.querySelector('#cards').innerHTML=cards.map((l,i)=>`<div class="terrain-stack"><article class="terrain-card">${terrainBorders(l)}<div class="terrain-header"><h3>${l.name}</h3><span class="protection">+3</span></div>${terrainInformation(l)}${terrainMarkers(l,{type:'C'})}${formationGrid(l,i?units.map(u=>({...u,cover:'c'})):units,[],{selected:'staff'})}${terrainFooter(l)}</article>${hillStack(l)}</div>`).join('');bindUnitTooltips(document.querySelector('#cards'));
</script><style>body{padding:12px}#cards{grid-template-columns:repeat(2,350px);min-width:0}@media(max-width:750px){#cards{grid-template-columns:minmax(0,1fr)}}</style></body></html>
