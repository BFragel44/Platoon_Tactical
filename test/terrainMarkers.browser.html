<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readable terrain mission markers</title></head><body><h2>Terrain mission marker validation</h2><p>Production counter renderer · no saved game is read or written.</p><main class="company-map" id="cards"></main><script type="module">
import '../src/style.css';import '../src/ui/company.css';import '../src/ui/workspace.css';
import {terrainMarkers} from '../src/ui/terrainMarkers.js';import {terrainInformation,terrainFooter,hillStack} from '../src/ui/terrainPresentation.js';import {terrainBorders} from '../src/ui/terrainBorders.js';import {borders} from '../src/sim/company/terrain.js';
const cards=[{id:'a',name:'2.1 Unrevealed terrain',known:false},{id:'b',name:'2.2 Unrevealed terrain',known:false},{id:'c',name:'2.3 Unrevealed terrain',known:false},...['Hedgerow / Bocage','Farm / Hill','Orchard'].map((name,i)=>({id:'d'+i,name:`1.${i+1} ${name}`,known:true,protection:i===2?1:2,elevation:i===1?2:1,hills:i===1?['hill']:[],borders:borders(),cover_draw:3,cover_limit:2,covers:[],burst:i===2?-1:0,trafficability:i===2?'Unmarked':'Slow',building:i===1}))];
const goals={primary:{location:'a'},secondary:{location:'b'},attack:{location:'d1'},ccp:{location:'d0',secured:true}};
document.querySelector('#cards').innerHTML=cards.map((l,i)=>`<div class="terrain-stack"><article class="terrain-card">${terrainBorders(l)}<div class="terrain-header"><h3>${l.name}</h3>${l.known?`<span class="protection">+${l.protection}</span>`:''}</div>${terrainInformation(l)}${terrainMarkers(l,{type:['B','B','B','A','C','?'][i]},goals)}${terrainFooter(l)}</article>${hillStack(l)}</div>`).join('');
</script><style>body{padding:12px}#cards{grid-template-columns:repeat(3,minmax(0,1fr));min-width:0}.terrain-card{min-height:240px}@media(max-width:600px){#cards{grid-template-columns:1fr}}</style></body></html>
