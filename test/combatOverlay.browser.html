<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact combat overlay validation</title></head><body><header style="height:150px;padding:20px"><h2>3.7.4 · Mutual combat effects</h2><p>Visual fixture · production renderer and real frozen combat</p><button id="reopen">Open combat</button></header><main class="company-workspace"><section class="battlefield-stage"><h3>Battlefield remains in place</h3><div id="map" class="company-map"></div></section><aside class="company-orders panel"><h3>Formation orders</h3><p>Inventory remains in place</p><p>1/1 Rifle Squad</p></aside></main><div id="overlay"></div><script type="module">
import '../src/style.css';import '../src/ui/company.css';import '../src/ui/workspace.css';import '../src/ui/combatOverlay.css';
import {resolveDisplayedExchange} from '../src/ui/combatExchange.js';import {spot} from '../src/sim/company/battlefield.js';import {combatScreen} from '../src/ui/combatScreen.js';import {terrainInformation} from '../src/ui/terrainPresentation.js';
import {companyAssault} from '../src/scenarios/companyAssault.js';import {createMission,advancePhase,getPlayerView,resolveCombat} from '../src/sim/company/engine.js';import {refresh} from '../src/sim/company/battlefield.js';
let s=createMission(companyAssault,'overlay');s.units.s11.location='r1c1';s.units.s11.exposed=true;s.units.secret={...structuredClone(s.units.mg1),id:'secret',name:'Secret German LMG',faction:'enemy',location:'r1c2',fire:'r1c1',radios:[]};if(new URLSearchParams(location.search).has('known')){s.units.s11.fire='r1c2';spot(s,s.units.secret);}refresh(s);s.phase='PINNED_RECOVERY';s=advancePhase(s).state;
const root=document.querySelector('#overlay');function show(){const v=getPlayerView(s),c=v.combat_resolution;root.innerHTML=c?combatScreen(c,v,id=>s.locations[id].name,c.status==='RESOLVED'?'result':'pre'):'';root.querySelector('#combat-close')?.addEventListener('click',()=>root.innerHTML='');root.querySelector('#combat-resolve')?.addEventListener('click',()=>{s=resolveDisplayedExchange(s).state;show();});root.querySelector('#combat-next')?.addEventListener('click',()=>{s=advancePhase(s).state;show();});}
document.querySelector('#map').innerHTML=Object.values(s.locations).filter(l=>!l.staging).map(l=>`<article class="terrain-card"><h3>${l.name}</h3>${terrainInformation(l)}</article>`).join('');document.querySelector('#reopen').onclick=show;show();
</script><style>:root{--command-header-height:150px}.battlefield-stage{padding:12px}.company-orders{min-height:300px}@media(max-width:850px){.company-workspace{grid-template-columns:1fr}}</style></body></html>
