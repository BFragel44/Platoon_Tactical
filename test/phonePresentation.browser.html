<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone wire visibility check</title><body><main style="padding:20px"><h1>Field-phone network</h1><p>Company HQ → laid wire → 1 Platoon HQ</p><button id="cut">Report cut and lost connection</button><button id="resume">Simulate reload (no old alert)</button><section class="battlefield-stage" style="min-height:520px;padding-top:200px"><div class="company-map" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div></section></main><script type="module">
import '/src/style.css';import '/src/ui/company.css';import '/src/ui/workspace.css';
import {phoneWireMarkup,phoneConnectionLosses,createPhoneNotifications} from '/src/ui/phonePresentation.js';import {createMission,getPlayerView} from '/src/sim/company/engine.js';import {trevieres} from '/src/scenarios/trevieres.js';import {emit} from '/src/sim/company/core.js';
const s=createMission(trevieres,'wire-browser',{command_network:'phones'});for(const u of Object.values(s.units))if(!['co','hq1'].includes(u.id))u.removed='RESERVE';s.units.co.location='r1c1';s.units.hq1.location='r3c1';s.phone_lines=[{id:'wire',location:'r2c1',owner:'co',cut:false}];emit(s,'PHONE_LINE_LAID','Wire laid.',{location:'r2c1'});const notifications=createPhoneNotifications();
function paint(){const v=getPlayerView(s);document.querySelector('.company-map').innerHTML=['r1c1','r2c1','r3c1'].map(id=>`<article class="terrain-card"><h3>${s.locations[id].name}</h3>${phoneWireMarkup(v.phone_lines,id)}${v.units.filter(u=>!u.removed&&u.location===id).map(u=>`<p>${u.name} · EE8 phone</p>`).join('')}</article>`).join('');notifications.sync(document.querySelector('.battlefield-stage'));}
document.querySelector('#cut').onclick=()=>{const before=getPlayerView(s);s.phone_lines[0].cut=true;emit(s,'PHONE_LINE_CUT','Wire cut by incoming fire.',{location:'r2c1'});notifications.push(phoneConnectionLosses(before,getPlayerView(s)),[s.locations.r2c1.name]);paint();};document.querySelector('#resume').onclick=()=>{notifications.reset();paint();};paint();
</script></body></html>
