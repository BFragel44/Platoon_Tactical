<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selective equipment drop check</title><body><main style="max-width:360px;margin:20px auto"><h2>Company HQ</h2><p>Staging · field-phone network</p><section id="inventory"></section><p role="status" id="result"></p></main><script type="module">
import '/src/style.css';import '/src/ui/company.css';import '/src/ui/workspace.css';
import {createMission,getPlayerView,submitCommand} from '/src/sim/company/engine.js';import {trevieres} from '/src/scenarios/trevieres.js';import {inlineInventory} from '/src/ui/unitDetails.js';
let s=createMission(trevieres,'drop-browser',{command_network:'phones'});
function paint(){document.querySelector('#inventory').innerHTML=inlineInventory(getPlayerView(s).units.find(u=>u.id==='co'));const fields=[...document.querySelectorAll('[data-drop-quantity]')],button=document.querySelector('#drop-selected-items');for(const f of fields)f.oninput=()=>button.disabled=!fields.some(e=>Number(e.value)>0)||fields.some(e=>!e.checkValidity());button.onclick=()=>{const r=submitCommand(s,{type:'DROP_LOAD',unit_id:'co',drop_items:fields.filter(e=>Number(e.value)>0).map(e=>({type:e.dataset.dropType,key:e.dataset.dropKey,quantity:Number(e.value)}))});s=r.state;document.querySelector('#result').textContent=r.accepted?`Dropped selected items. ${s.units.co.assets.phone_line} phone lines retained; ${s.units.co.radios.length} radios/phones retained. No command or exposure added.`:r.reason;paint();};}paint();
</script></body></html>
