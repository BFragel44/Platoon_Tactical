<!doctype html><html lang="en"><meta charset="utf-8"><title>Combat desktop acceptance</title>
<style>body{margin:0;width:1100px;height:680px;overflow:hidden}iframe{display:block;width:1600px;height:1000px;border:0;transform:scale(.68);transform-origin:top left}</style>
<iframe title="Desktop combat game" src="/"></iframe>
<script>
// The isolated acceptance origin contains only its own generated checkpoint.
document.querySelector('iframe').onload=event=>{
 if(location.port!=='5184')return;
 const game=event.target.contentDocument;
 game.querySelector('[data-resume-save]')?.click();
};
</script></html>
