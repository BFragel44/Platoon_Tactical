<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public card pulls validation</title></head><body><header><h2>Public card pulls · synthetic UI fixture</h2><p>Production draw metadata and presentation. This does not modify a saved game.</p><button id="spot">Spot position</button><button id="fire">Request artillery</button><button id="home">Home / return</button><button id="reload">Recover checkpoint</button><button id="xp">Show XP notification</button><button id="reset">Fresh fixture</button></header><main class="battlefield-stage"><div class="map-viewport"><article class="terrain-card"><h3>1.1 Woods</h3><p>1/1 Rifle Squad · public spotting attempt</p></article><article class="terrain-card"><h3>1.2 Marsh</h3><p>Fire request target</p></article></div><div class="map-controls"><button>Reset LOS</button><button>Find unit</button><button>Zoom</button></div></main><aside id="history"></aside><script type="module">
import '../src/style.css';import '../src/ui/company.css';import '../src/ui/cardDraws.css';
import {createMission,submitCommand,getVisibleEvents} from '../src/sim/company/engine.js';
import {trevieres} from '../src/scenarios/trevieres.js';
import {cards,annotatePublicDraws} from '../src/sim/company/core.js';
import {supportRequest} from '../src/sim/company/missionFeatures.js';
import {createCardDrawNotifications,recentDrawMarkup,publicDrawGroups} from '../src/ui/cardDraws.js';
import {createExperienceNotifications} from '../src/ui/experienceNotifications.js';
const controller=createCardDrawNotifications(),xp=createExperienceNotifications(),stage=document.querySelector('main');let s,key=0,away=false;
const render=()=>{document.querySelector('#history').innerHTML=recentDrawMarkup(getVisibleEvents(s),s.turn);document.querySelectorAll('[data-replay-draw]').forEach(b=>b.onclick=()=>controller.replay(publicDrawGroups(getVisibleEvents(s)).find(g=>g.id===b.dataset.replayDraw)));if(!away)controller.sync(stage,String(key),getVisibleEvents(s));};
function reset(){s=createMission(trevieres,'reveal-fixture');s.units.s11.location='r1c1';s.phase='GENERAL_INITIATIVE';s.impulse={id:'fixture',hq:'general',commands:20,spent:0};key++;controller.prime(String(key),s.events);render();}
document.querySelector('#spot').onclick=()=>{const hit=Object.values(cards).find(c=>c.id!==51&&c.spot),miss=Object.values(cards).find(c=>c.id!==51&&!c.spot);s.units.fixture_enemy={...structuredClone(s.units.s11),id:'fixture_enemy',name:'Synthetic unspotted enemy',faction:'enemy',unspotted_position_public:true,fire:null,vof:null};delete s.knowledge.spotted.fixture_enemy;s.deck.order=[miss.id,hit.id,...s.deck.order];s=submitCommand(s,{type:'SPOT',unit_id:'s11',issuer_id:'s11',target_id:'r1c1'}).state;render();};
document.querySelector('#fire').onclick=()=>{const before=structuredClone(s),short=Object.values(cards).find(c=>c.short);s.deck.order=Array(8).fill(short.id).concat(s.deck.order);supportRequest(s,s.units.artyfo,'artillery','HE','r1c2');annotatePublicDraws(before,s);render();};
document.querySelector('#home').onclick=()=>{away=!away;stage.hidden=away;if(away)controller.pause();else render();};
document.querySelector('#reload').onclick=()=>{controller.prime(String(key),s.events);render();};
document.querySelector('#xp').onclick=()=>xp.push([{points:1,recipient:'Company',task:'Synthetic notification placement check',turn:1,pool:'Company'}]);
document.querySelector('#reset').onclick=reset;reset();
</script><style>header{height:130px;padding:12px}.battlefield-stage{height:calc(100vh - 180px);min-height:350px;margin:12px;border:1px solid #7b876e}.map-viewport{display:flex;gap:12px;padding:12px;overflow:auto;height:100%}.terrain-card{min-width:250px;padding:12px}.map-controls{position:absolute;bottom:12px;left:12px}#history{padding:12px}:root{--command-header-height:130px}@media(max-width:700px){header{height:180px}:root{--command-header-height:180px}.battlefield-stage{height:calc(100vh - 220px)}}</style></body></html>
