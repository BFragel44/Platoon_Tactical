<!doctype html><html><head><meta charset="utf-8"><title>Combat layout acceptance</title></head><body><header class="test-header">Combat layout · 24 exposures · isolated preview</header><main class="combat-workspace company-workspace"><section class="battlefield-stage combat-map-active"><p>Pending choices wrap below. Completed combats remain available for review.</p><div id="recipients"></div></section><aside class="company-orders combat-orders" id="desk"></aside></main><script type="module">
import '../src/style.css';import '../src/ui/company.css';import '../src/ui/workspace.css';import '../src/ui/combatOverlay.css';
import {combatRecipients,combatScreen} from '../src/ui/combatScreen.js';
const primary={kind:'BASIC_FIRE',source_id:'enemy',origin:'r4c1',vof:-3,label:'Sniper fire'};
const rows=Array.from({length:24},(_,i)=>({id:`e${i}`,target_name:`${i===23?'Paralyzed team':'Rifle Squad'} ${i+1}`,target_location:'r2c4',target_faction:'friendly',target_steps:1,target_experience:'Green',target_pinned:true,status:i<12?'RESOLVED':'PENDING',result:i<12?'PIN':null,ncm:1,total:1,modifiers:[{label:'Selected fire VOF',value:-3,source:'FIRE'},{label:'2.4 Woods',value:2},{label:'Cover',value:1},{label:'Pinned protection',value:1}],sources:[primary,...Array.from({length:6},(_,i)=>({...primary,source_id:`other${i}`,vof:0,label:'Unidentified fire'}))],strongest:primary}));
let current=rows.at(-1);const view={combat_order:'player-choice-v1',combat_resolutions:rows};
function render(){document.querySelector('#desk').innerHTML=combatScreen(current,view,id=>id);document.querySelector('#recipients').innerHTML=combatRecipients(view,current,id=>id);document.querySelectorAll('[data-combat-select]').forEach(b=>b.onclick=()=>{current=rows.find(r=>r.id===b.dataset.combatSelect);render();});document.querySelector('#combat-resolve')?.addEventListener('click',()=>{current.status='RESOLVED';current.result='PIN';render();});}render();
</script><style>:root{--command-header-height:100px}body{margin:0}.test-header{height:100px;padding:30px;font-size:22px}.battlefield-stage>p{padding:20px}</style></body></html>
