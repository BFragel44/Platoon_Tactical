<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terrain and cover visual fixture</title></head><body><h2>Terrain / cover visual fixture — synthetic occupied positions</h2><p>Uses the production terrain and formation-cover renderers. No saved game is read or written.</p><main class="company-map" id="cards"></main><script type="module">
import '../src/style.css';import '../src/ui/company.css';import '../src/ui/workspace.css';
import {terrainInformation,terrainFooter,hillStack,coverPositions,formationCover} from '../src/ui/terrainPresentation.js';
import {terrainBorders} from '../src/ui/terrainBorders.js';
import {normandyTerrain} from '../src/scenarios/normandyTerrain.js';
import {borders} from '../src/sim/company/terrain.js';
const card=(id,extra)=>({...structuredClone(normandyTerrain.find(c=>c.id===id)),known:true,elevation:1,covers:[],...extra});
const locations=[card('normandy_1_3_2',{elevation:3,hills:['hill','hill'],borders:borders(),covers:[{id:'ground',type:'Strong Building',value:3,known:true,discovered:true},{id:'upper',type:'Upper Story',value:3,known:true,parent:'ground',elevation:1}]}),card('normandy_2_2_8',{covers:[{id:'ground',type:'Light Building',value:2,known:true,discovered:true},{id:'tower',type:'Church Tower',value:2,known:true,parent:'ground',elevation:1,capacity:1}]}),card('normandy_1_1_7',{smoke:true,smoke_value:2,covers:[{id:'pillbox',type:'Pillbox',value:4,known:true,capacity:2,arc:[-1,0]}]}),{known:false,name:'2.1 Unrevealed terrain',covers:[]},card('normandy_1_1_3',{covers:[{id:'cover',type:'Cover',value:1,known:true,discovered:true}]})];
document.querySelector('#cards').innerHTML=locations.map(l=>`<div class="terrain-stack"><article class="terrain-card">${terrainBorders(l)}<h3>${l.name}</h3>${terrainInformation(l)}${coverPositions(l)}${[{name:'1/1 Rifle Squad',cover:null},...l.covers.map(c=>({name:c.elevation?'Forward observer':'2/1 Rifle Squad',cover:c.id,exposed:!!c.elevation})),...(new URLSearchParams(location.search).has('tall')?Array.from({length:15},(_,i)=>({name:`Additional formation ${i+1}`,cover:null})):[])].map(u=>`<div class="unit-counter"><b>${u.name}</b>${formationCover(l,u)}</div>`).join('')}${terrainFooter(l)}</article>${hillStack(l)}</div>`).join('');
</script><style>body{padding:14px}#cards{min-width:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.unit-counter{margin:6px 0;width:100%}@media(max-width:650px){#cards{grid-template-columns:220px}}</style></body></html>
