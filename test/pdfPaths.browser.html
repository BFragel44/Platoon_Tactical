<!doctype html><html><head><meta charset="utf-8"><title>Parallel PDF preview</title></head><body><h2>Parallel PDF arrows</h2><p>Friendly and enemy fire · vertical, horizontal and diagonal · isolated presentation fixture</p><div class="preview"><svg id="fire-overlay" width="760" height="420"><defs><marker id="friendly-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#93d6a3"/></marker><marker id="enemy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f27c77"/></marker></defs></svg></div><script type="module">
import '../src/style.css';import '../src/ui/company.css';import {offsetPdfPoints} from '../src/ui/pdfPresentation.js';
const svg=document.querySelector('svg');
for(const points of [[[100,340],[100,50]],[[250,80],[650,80]],[[250,340],[650,160]]])for(const side of ['friendly','enemy']){const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('class',side);line.setAttribute('points',offsetPdfPoints(side==='friendly'?points:[...points].reverse()).map(p=>p.join(',')).join(' '));line.setAttribute('marker-end',`url(#${side}-arrow)`);svg.append(line);}
</script><style>body{padding:24px}.preview{position:relative;width:760px;height:420px;background:#20352a;border:1px solid #a2ab89}</style></body></html>
