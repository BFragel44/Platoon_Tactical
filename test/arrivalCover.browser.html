<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrival cover check</title><body><main style="max-width:360px;margin:24px auto"><h2>Formation orders</h2><p>1/1 Rifle Squad · 3 steps</p><label class="field">Order<select id="type"><option value="MOVE">Move</option><option value="INFILTRATE">Infiltrate</option></select></label><label class="field">Target<select id="destination"><option value="">Choose target</option><option value="r1c1">1.1 — destination with cover</option></select></label><section id="arrival"></section><button id="issue">Issue order · 1 command</button><p role="status" id="status"></p></main><script type="module">
import '/src/style.css';import '/src/ui/company.css';
import {arrivalCoverMarkup} from '/src/ui/arrivalCover.js';
import {createMission} from '/src/sim/company/engine.js';import {companyAssault} from '/src/scenarios/companyAssault.js';import {commandOptions,submitCommand} from '/src/sim/company/actions.js';
const s=createMission(companyAssault,'arrival-browser');s.impulse={id:'test',hq:'general',commands:4,spent:0};s.units.s11.location='r0c1';s.units.s11.cover=null;s.locations.r1c1.covers=[{id:'existing',known:true,type:'Cover',value:1}];s.fire=[{source:'enemy',origin:'r1c2',target:'r1c1',value:0}];
const type=document.querySelector('#type'),target=document.querySelector('#destination'),arrival=document.querySelector('#arrival');
function paint(){const option=commandOptions(s,s.units.s11,'co').find(o=>o.type===type.value);arrival.innerHTML=arrivalCoverMarkup(option.targets.find(t=>t.id===target.value)?.arrival_covers??[],()=> 'C1 · Cover +1');}type.onchange=target.onchange=paint;
document.querySelector('#issue').onclick=()=>{const r=submitCommand(s,{type:type.value,unit_id:'s11',issuer_id:'co',target_id:target.value,arrival_cover:document.querySelector('#arrival-cover')?.value??'open'});document.querySelector('#status').textContent=r.accepted?`Arrived ${r.state.units.s11.cover?'under selected cover':'outside additional cover'}; ${r.state.impulse.commands} commands remain. Original fixture unchanged.`:r.reason;};
</script></body></html>
