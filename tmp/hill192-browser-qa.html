<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hill 192 isolated browser QA</title></head><body><div id="app"></div><script type="module">
import data from './hill192-browser-cases.json';
const key=new URLSearchParams(location.search).get('case')||'initial';
if(sessionStorage.getItem('hill-qa-case')!==key){const cp=data.cases[key];if(!cp)throw Error('Unavailable QA case '+key);localStorage.setItem('platoon-company-recovery',JSON.stringify({schema:1,latest:cp,turnStart:cp}));localStorage.setItem('platoon-normandy-battlefields',JSON.stringify({schema:1,entries:{[data.source.source.mission_instance_id]:data.source}}));localStorage.setItem('platoon-normandy-hill-192-standalone',JSON.stringify({schema:1,...cp.replay.roster_snapshot,applied_missions:{}}));sessionStorage.setItem('hill-qa-case',key);}
await import('./hill192-company-qa.js');
</script></body></html>
